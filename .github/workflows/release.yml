name: Release to PyPI

# Publishes when a GitHub release is published (tag format: v0.1.0).
#
# Uses PyPI Trusted Publishing (OIDC) — no long-lived token stored in the repo.
# One-time setup on pypi.org: project "llmjury-sdk" -> Publishing -> add GitHub publisher
# (owner: llmjury, repo: llmjury-python, workflow: release.yml, environment: pypi).

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tag matches package version
        run: |
          pip install -e .
          PKG_VERSION=$(python -c "import llmjury; print(llmjury.__version__)")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION" >&2
            exit 1
          fi
      - name: Run tests
        run: |
          pip install -e ".[dev]"
          pytest
      - name: Build
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
